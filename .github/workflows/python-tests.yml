name: Tests & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Un push con varios commits cancelaba ejecuciones intermedias que
# fallaban por mezclar código nuevo con código viejo (y generaba
# correos de fallo por cada ejecución). Con cancel-in-progress, solo
# la ejecución del último commit llega al final.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -q typer rich httpx fastapi pydantic

    - name: Syntax check
      # NOTE: `python -m py_compile **/*.py` does not recurse (globstar is
      # off in sh), so it only checked the top-level file. find covers
      # every subdirectory instead.
      run: |
        python -m py_compile $(find . -name '*.py' -not -path './.venv/*' -not -path './.git/*')

  test-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -q typer[all] rich httpx fastapi uvicorn pydantic requests pytest

    - name: Test imports
      # This job must FAIL if the CLI cannot be imported: the previous
      # version swallowed ImportError and always exited 0.
      run: |
        python3 -c "
        import sys
        from pathlib import Path
        sys.path.insert(0, str(Path('.').resolve()))
        from pentia import app
        print('✓ Main CLI imports OK')
        "

    - name: Run tests
      # tests/ is added separately by the coordinator; this step runs the
      # smoke suite once it exists.
      run: pytest tests/ -q
